<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sermon Stream</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        /* Minimal, page-scoped styles for the streaming layout */
        .sermon-stream-container { max-width: 1100px; margin: 0 auto; padding: 1rem; }
        .sermon-stream-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
        .sermon-stream-title { font-size: 1.75rem; margin: 1rem 0; }
        .back-link { color: inherit; text-decoration: none; font-size: 0.95rem; opacity: 0.8; }
        .back-link:hover { text-decoration: underline; opacity: 1; }
        .video-wrapper { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
        .video-wrapper iframe { width: 100%; height: 100%; border: 0; display: block; }
        .fallback { padding: 2rem; text-align: center; border: 1px solid rgba(0,0,0,0.08); border-radius: 8px; }
    </style>
</head>
<body>
    <header class="site-header">
        <nav class="main-navigation">
            <div class="church-logo">Your Church Name</div>
            <ul class="navigation-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#sermons">Sermons</a></li>
                <li><a href="index.html#events">Events</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-container">
        <section class="sermon-stream-container" aria-label="Sermon stream">
            <div class="sermon-stream-header">
                <h1 class="sermon-stream-title" id="sermonTitle">Sermon</h1>
                <a class="back-link" href="index.html#sermons">&#8592; Back to Sermons</a>
            </div>

            <div class="video-wrapper" id="videoWrapper" aria-label="Sermon video player"></div>
            <div class="fallback" id="fallback" hidden>
                Video unavailable. The sermon video could not be loaded. If you followed a link here,
                please verify the YouTube ID or try again later.
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-content-grid">
            <div class="footer-column">
                <h3 class="footer-heading">Connect</h3>
                <a href="#">YouTube</a>
            </div>
        </div>
    </footer>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const title = (params.get('title') || 'Sermon').toString();
            const youtubeId = (params.get('youtubeId') || '').toString();

            // Set document and on-page title safely
            document.title = title + ' - Sermon Stream';
            const titleEl = document.getElementById('sermonTitle');
            if (titleEl) titleEl.textContent = title;

            const wrapper = document.getElementById('videoWrapper');
            const fallback = document.getElementById('fallback');

            // Basic validation for YouTube video IDs (11-char typical pattern)
            const isValidYouTubeId = /^[a-zA-Z0-9_-]{11}$/.test(youtubeId);

            if (youtubeId && isValidYouTubeId) {
                const src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(youtubeId);
                const iframe = document.createElement('iframe');
                iframe.src = src;
                iframe.title = title + ' - YouTube player';
                iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
                iframe.allowFullscreen = true;
                iframe.referrerPolicy = 'strict-origin-when-cross-origin';
                wrapper.appendChild(iframe);
            } else {
                // Hide the player wrapper and show a friendly fallback
                if (wrapper) wrapper.style.display = 'none';
                if (fallback) fallback.hidden = false;
            }
        })();
    </script>
</body>
</html>

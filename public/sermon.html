<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sermon Stream</title>
    <link rel="stylesheet" href="css/styles.css" />

</head>
<body>
    <header class="site-header"></header>

    <main class="main-container">
        <section class="sermon-stream-container" aria-label="Sermon stream">
            <div class="sermon-stream-header">
                <h1 class="sermon-stream-title" id="sermonTitle">Sermon</h1>
                <a class="back-link" href="index.html#sermons">&#8592; Back to Sermons</a>
            </div>

            <div class="video-wrapper" id="videoWrapper" aria-label="Sermon video player"></div>
            <div class="fallback" id="fallback" hidden>
                Video unavailable. The sermon video could not be loaded. If you followed a link here,
                please verify the YouTube ID or try again later.
            </div>
        </section>
    </main>

    <footer class="site-footer"></footer>

    <script src="js/script.js"></script>
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const title = (params.get('title') || 'Sermon').toString();
            const youtubeId = (params.get('youtubeId') || '').toString();

            // Set document and on-page title safely
            document.title = title + ' - Sermon Stream';
            const titleEl = document.getElementById('sermonTitle');
            if (titleEl) titleEl.textContent = title;

            const wrapper = document.getElementById('videoWrapper');
            const fallback = document.getElementById('fallback');

            // Basic validation for YouTube video IDs (11-char typical pattern)
            const isValidYouTubeId = /^[a-zA-Z0-9_-]{11}$/.test(youtubeId);

            if (youtubeId && isValidYouTubeId) {
                const src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(youtubeId);
                const iframe = document.createElement('iframe');
                iframe.src = src;
                iframe.title = title + ' - YouTube player';
                iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
                iframe.allowFullscreen = true;
                iframe.referrerPolicy = 'strict-origin-when-cross-origin';
                wrapper.appendChild(iframe);
            } else {
                // Hide the player wrapper and show a friendly fallback
                if (wrapper) wrapper.style.display = 'none';
                if (fallback) fallback.hidden = false;
            }
        })();
    </script>
</body>
    <script src="js/script.js"></script>
</html>

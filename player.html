<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sermon Player</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; margin: 0; }
        .player-container { max-width: 1200px; margin: 0 auto; padding: 1rem; }
        .video-section { background: #1a1a1a; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .video-player { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
        .video-player video { width: 100%; height: 100%; display: block; background: #000; }
        .video-poster { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); transition: opacity 0.3s; }
        .video-poster.hidden { opacity: 0; pointer-events: none; }
        .video-poster-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .play-button-large { position: relative; width: 80px; height: 80px; background: rgba(255,255,255,0.95); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .play-button-large:hover { transform: scale(1.1); background: #fff; }
        .play-button-large::after { content: ''; width: 0; height: 0; border-left: 24px solid #667eea; border-top: 14px solid transparent; border-bottom: 14px solid transparent; margin-left: 6px; }
        .sermon-title-overlay { position: relative; margin-top: 1rem; text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        .sermon-title-overlay h2 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .sermon-title-overlay p { font-size: 1.1rem; opacity: 0.9; }
        .video-controls { position: absolute; inset-inline: 0; bottom: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); padding: 1.5rem 1rem 1rem; opacity: 0; transition: opacity 0.3s; }
        .video-player:hover .video-controls, .video-controls.show { opacity: 1; }
        .progress-bar-container { width: 100%; height: 5px; background: rgba(255,255,255,0.3); border-radius: 3px; cursor: pointer; margin-bottom: 1rem; }
        .progress-bar { height: 100%; background: #667eea; border-radius: 3px; width: 0%; transition: width 0.1s; }
        .controls-row { display: flex; align-items: center; gap: 1rem; }
        .control-button { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; padding: 0.5rem; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
        .control-button:hover { transform: scale(1.1); }
        .time-display { font-size: 0.9rem; min-width: 100px; }
        .volume-container { display: flex; align-items: center; gap: 0.5rem; }
        .volume-slider { width: 80px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; cursor: pointer; position: relative; }
        .volume-slider-fill { height: 100%; background: #fff; border-radius: 2px; width: 100%; }
        .loading-spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        .loading-spinner.active { display: block; }
        @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
        .video-info { padding: 2rem; background: #1a1a1a; }
        .video-info h1 { font-size: 1.75rem; margin-bottom: 1rem; }
        .video-meta { display: flex; gap: 2rem; font-size: 0.95rem; color: #aaa; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .video-description { line-height: 1.6; color: #ccc; margin-bottom: 2rem; }
        .sermon-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; padding: 1.5rem; background: #0f0f0f; border-radius: 8px; }
        .detail-item { display: flex; flex-direction: column; gap: 0.25rem; }
        .detail-label { font-size: 0.85rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-value { font-size: 1rem; color: #fff; font-weight: 500; }
        @media (max-width: 768px) { .volume-container { display: none; } .sermon-title-overlay h2 { font-size: 1.5rem; } }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="video-section">
            <div class="video-player" id="videoPlayer">
                <video id="mainVideo" preload="metadata" playsinline></video>
                <div class="video-poster" id="videoPoster">
                    <img class="video-poster-image" id="posterImage" alt="Video Poster" />
                    <div class="play-button-large" id="playButtonLarge"></div>
                    <div class="sermon-title-overlay">
                        <h2 id="overlayTitle">Sermon Title</h2>
                        <p id="overlayMeta">Speaker • Date</p>
                    </div>
                </div>
                <div class="loading-spinner" id="loadingSpinner"></div>
                <div class="video-controls" id="videoControls">
                    <div class="progress-bar-container" id="progressContainer">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <div class="controls-row">
                        <button class="control-button" id="playPauseBtn">▶️</button>
                        <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
                        <div class="volume-container">
                            <button class="control-button" id="volumeBtn">🔊</button>
                            <div class="volume-slider" id="volumeSlider">
                                <div class="volume-slider-fill" id="volumeFill"></div>
                            </div>
                        </div>
                        <div style="flex:1"></div>
                        <button class="control-button" id="fullscreenBtn">⛶</button>
                    </div>
                </div>
            </div>
            <div class="video-info">
                <h1 id="infoTitle">Sermon Title</h1>
                <div class="video-meta">
                    <span id="infoDate">📅 Date</span>
                    <span id="infoSpeaker">👤 Speaker</span>
                    <span id="infoDuration">⏱️ Duration</span>
                </div>
                <p class="video-description" id="infoDescription">Add a description for this sermon.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js" integrity="sha256-Fn2YfE8jyzrM+8wHCazGbQp6aF2d3aJx+VZqnhuJf2k=" crossorigin="anonymous"></script>
    <script>
        (function(){
            const qs = new URLSearchParams(location.search);
            const title = (qs.get('title') || 'Self-hosted Sermon (Example)').toString();
            const src = (qs.get('src') || 'https://example.com/media/sermons/example-1080p.mp4').toString();
            const poster = (qs.get('poster') || 'https://example.com/media/sermons/example-poster.jpg').toString();
            const speaker = (qs.get('speaker') || 'Pastor Name').toString();
            const date = (qs.get('date') || 'Jan 1, 2025').toString();
            const duration = (qs.get('duration') || '45:00').toString();
            const description = (qs.get('description') || 'This is a placeholder description. Replace with your sermon summary.').toString();

            document.title = title + ' - Sermon Player';
            document.getElementById('overlayTitle').textContent = title;
            document.getElementById('overlayMeta').textContent = speaker + ' • ' + date;
            document.getElementById('infoTitle').textContent = title;
            document.getElementById('infoDate').textContent = '📅 ' + date;
            document.getElementById('infoSpeaker').textContent = '👤 ' + speaker;
            document.getElementById('infoDuration').textContent = '⏱️ ' + duration;
            document.getElementById('infoDescription').textContent = description;

            const video = document.getElementById('mainVideo');
            const posterImg = document.getElementById('posterImage');
            const posterContainer = document.getElementById('videoPoster');
            const playButtonLarge = document.getElementById('playButtonLarge');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const controls = document.getElementById('videoControls');
            const progressBar = document.getElementById('progressBar');
            const progressContainer = document.getElementById('progressContainer');
            const timeDisplay = document.getElementById('timeDisplay');
            const volumeBtn = document.getElementById('volumeBtn');
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeFill = document.getElementById('volumeFill');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const playerShell = document.getElementById('videoPlayer');

            // Set poster image
            posterImg.src = poster;
            posterImg.onerror = function(){ posterImg.remove(); };

            // Attach source (HLS if m3u8)
            function attachSource(url){
                if (url.toLowerCase().endsWith('.m3u8')) {
                    if (Hls.isSupported()) {
                        const hls = new Hls({ maxBufferLength: 30 });
                        hls.loadSource(url);
                        hls.attachMedia(video);
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = url; // Safari
                    } else {
                        // Fallback: show message or try MP4 alternative if provided
                        console.warn('HLS not supported in this browser');
                    }
                } else {
                    const source = document.createElement('source');
                    source.src = url;
                    source.type = 'video/mp4';
                    video.appendChild(source);
                }
            }
            attachSource(src);

            // Player controls
            let isPlaying = false;
            let controlsTimeout = null;

            function formatTime(seconds){
                if (isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60) || 0;
                const secs = Math.floor(seconds % 60) || 0;
                return `${mins}:${secs.toString().padStart(2,'0')}`;
            }
            function updateTime(){
                timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
            }
            function updateProgress(){
                const pct = (video.currentTime / (video.duration || 1)) * 100;
                progressBar.style.width = pct + '%';
                updateTime();
            }
            function seek(e){
                const rect = progressContainer.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                video.currentTime = pos * (video.duration || 0);
            }

            function play(){ video.play(); posterContainer.classList.add('hidden'); }
            function togglePlay(){ video.paused ? video.play() : video.pause(); }
            function onPlay(){ isPlaying = true; playPauseBtn.textContent = '⏸️'; }
            function onPause(){ isPlaying = false; playPauseBtn.textContent = '▶️'; }
            function toggleMute(){ video.muted = !video.muted; volumeBtn.textContent = video.muted ? '🔇' : '🔊'; volumeFill.style.width = video.muted ? '0%' : (video.volume*100)+'%'; }
            function changeVolume(e){ const rect = volumeSlider.getBoundingClientRect(); const pos = (e.clientX-rect.left)/rect.width; video.volume = Math.max(0, Math.min(1, pos)); video.muted=false; volumeBtn.textContent='🔊'; volumeFill.style.width=(video.volume*100)+'%'; }
            function toggleFullscreen(){ if (!document.fullscreenElement) { playerShell.requestFullscreen(); } else { document.exitFullscreen(); } }
            function showControls(){ controls.classList.add('show'); clearTimeout(controlsTimeout); if (isPlaying) { controlsTimeout = setTimeout(()=>controls.classList.remove('show'), 3000); } }
            function hideControls(){ if (isPlaying) controls.classList.remove('show'); }
            function showLoading(){ loadingSpinner.classList.add('active'); }
            function hideLoading(){ loadingSpinner.classList.remove('active'); }

            playButtonLarge.addEventListener('click', play);
            playPauseBtn.addEventListener('click', togglePlay);
            video.addEventListener('timeupdate', updateProgress);
            video.addEventListener('loadedmetadata', updateTime);
            video.addEventListener('play', onPlay);
            video.addEventListener('pause', onPause);
            video.addEventListener('waiting', showLoading);
            video.addEventListener('canplay', hideLoading);

            progressContainer.addEventListener('click', seek);
            volumeBtn.addEventListener('click', toggleMute);
            volumeSlider.addEventListener('click', changeVolume);
            fullscreenBtn.addEventListener('click', toggleFullscreen);

            playerShell.addEventListener('mousemove', showControls);
            playerShell.addEventListener('mouseleave', hideControls);

            document.addEventListener('keydown', (e)=>{
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
                switch(e.key){
                    case ' ': case 'k': e.preventDefault(); togglePlay(); break;
                    case 'f': toggleFullscreen(); break;
                    case 'm': toggleMute(); break;
                    case 'ArrowLeft': video.currentTime = Math.max(0, video.currentTime - 5); break;
                    case 'ArrowRight': video.currentTime = Math.min(video.duration||0, video.currentTime + 5); break;
                }
            });
        })();
    </script>
</body>
</html>
